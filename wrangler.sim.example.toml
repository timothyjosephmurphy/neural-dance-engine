# Sim preview only. Copy to wrangler.sim.toml (gitignored) before deploying.
# Do not add an account_id, zone id, or a routes table.
# Do not copy the SIM_PARAMS binding into wrangler.toml.

name = "neural-dance-engine-sim"
main = "worker/index.mjs"
compatibility_date = "2026-09-29"
workers_dev = true

[assets]
directory = "./dist/assets"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = [ "/api/neural-dance/sim/*", "/neural-dance/sim", "/neural-dance/sim/", "/neural-dance/sim/index.html" ]

[durable_objects]
bindings = [
  { name = "SIM_PARAMS", class_name = "NeuralDanceSimParams" }
]

[[migrations]]
tag = "neural-dance-sim-params-v1"
new_sqlite_classes = [ "NeuralDanceSimParams" ]
